<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sistem Asset PMA — by Adi Nugraha</title>
<meta name="theme-color" content="#172019">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asset PMA">
<link rel="manifest" href="manifest.json">
<link rel="icon" id="faviconLink" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #EEF0EA;
    --surface: #FFFFFF;
    --surface-2: #F7F8F3;
    --ink: #1B2320;
    --ink-soft: #565F58;
    --line: #DEE1D6;
    --line-strong: #C7CBBC;
    --rail-bg: #172019;
    --rail-bg-2: #1E2A22;
    --rail-ink: #E7E9E1;
    --rail-ink-soft: #93A092;
    --amber: #E0912E;
    --amber-ink: #4A2E05;
    --teal: #3D6B5C;
    --rust: #B23A2E;
    --focus: #2F6F5C;
    --radius-sm: 4px;
    --radius-md: 7px;
    --shadow-1: 0 1px 2px rgba(23,32,25,0.06), 0 1px 1px rgba(23,32,25,0.04);
    --shadow-2: 0 8px 24px rgba(23,32,25,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  .display{ font-family:'Space Grotesk', system-ui, sans-serif; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .app{
    display:grid;
    grid-template-columns: 250px 1fr;
    height:100vh;
    min-height:560px;
  }

  /* ---------- RAIL / SIDEBAR ---------- */
  .rail{
    background: linear-gradient(180deg, var(--rail-bg) 0%, var(--rail-bg-2) 100%);
    color: var(--rail-ink);
    display:flex;
    flex-direction:column;
    min-width:0;
    overflow:hidden;
  }
  .rail-head{
    padding:22px 20px 16px;
    border-bottom:1px solid rgba(231,233,225,0.1);
    position:relative;
  }
  .rail-logo{
    width:44px; height:44px;
    border-radius:10px;
    display:block;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
  }
  .rail-close-btn{
    display:none;
    position:absolute; top:14px; right:14px;
    width:30px; height:30px; border-radius:6px;
    border:1px solid rgba(231,233,225,0.22);
    background:transparent; color:var(--rail-ink-soft);
    align-items:center; justify-content:center;
    cursor:pointer;
  }
  .rail-close-btn:hover{ color:var(--rail-ink); background:rgba(231,233,225,0.08); }
  .rail-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    color:var(--amber);
    background:rgba(224,145,46,0.14);
    border:1px solid rgba(224,145,46,0.35);
    padding:3px 8px;
    border-radius:3px;
    margin-bottom:10px;
  }
  .rail-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:20px;
    line-height:1.15;
    margin:0 0 3px;
  }
  .rail-sub{
    font-size:11.5px;
    color:var(--rail-ink-soft);
    margin:0;
  }
  .rail-list{
    flex:1;
    overflow-y:auto;
    padding:12px 10px 12px;
  }
  .rail-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--rail-ink-soft);
    padding:10px 10px 6px;
  }
  .rail-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 10px;
    border-radius:5px;
    cursor:pointer;
    color:var(--rail-ink-soft);
    border:1px solid transparent;
    margin-bottom:2px;
    transition: background .12s ease, color .12s ease;
    user-select:none;
  }
  .rail-item:hover{
    background:rgba(231,233,225,0.06);
    color:var(--rail-ink);
  }
  .rail-item.active{
    background:rgba(224,145,46,0.13);
    border-color:rgba(224,145,46,0.4);
    color:#F5DBAE;
  }
  .rail-item .ri-name{
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .rail-item .ri-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:inherit;
    opacity:0.75;
    flex:none;
  }
  .rail-item.overview .ri-name{ font-weight:600; }
  .rail-add{
    display:flex; align-items:center; gap:7px;
    padding:8px 10px;
    margin-top:6px;
    border-radius:5px;
    cursor:pointer;
    color:var(--rail-ink-soft);
    font-size:12.5px;
    border:1px dashed rgba(231,233,225,0.22);
  }
  .rail-add:hover{ color:var(--rail-ink); border-color:rgba(231,233,225,0.4); }
  .rail-foot{
    padding:14px 20px 18px;
    border-top:1px solid rgba(231,233,225,0.1);
    font-size:11px;
    color:var(--rail-ink-soft);
  }
  .rail-foot b{ color:var(--rail-ink); font-family:'IBM Plex Mono',monospace; }

  /* ---------- MAIN ---------- */
  .main{
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100vh;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
    flex-wrap:wrap;
  }
  .topbar-title-wrap{ flex:1; min-width:220px; }
  .topbar-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    margin:0 0 2px;
  }
  .topbar-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:21px;
    margin:0;
  }
  .search-wrap{
    position:relative;
    width:250px;
  }
  .search-wrap input{
    width:100%;
    padding:8px 12px 8px 30px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);
    background:var(--surface-2);
    color:var(--ink);
  }
  .search-wrap input:focus{ background:var(--surface); }
  .search-wrap svg{
    position:absolute; left:9px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 13px;
    border-radius:var(--radius-sm);
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    font-weight:500;
    font-size:13px;
    white-space:nowrap;
    transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  .btn:hover{ background:var(--surface-2); border-color:var(--ink-soft); }
  .btn:active{ transform:translateY(1px); }
  .btn svg{ flex:none; }
  .btn-primary{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--amber-ink);
    font-weight:600;
  }
  .btn-primary:hover{ background:#cc8228; border-color:#cc8228; }
  .btn-primary:disabled{
    opacity:0.45; cursor:default; transform:none;
  }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger-text{ color:var(--rust); }
  .btn-sm{ padding:5px 9px; font-size:12px; border-radius:4px; }
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:29px; height:29px;
    border-radius:5px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .icon-btn.danger:hover{ color:var(--rust); border-color:var(--rust); }
  .icon-btn.confirm:hover{ color:var(--teal); border-color:var(--teal); }

  .unsaved-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--amber);
    display:inline-block;
    box-shadow:0 0 0 3px rgba(224,145,46,0.22);
  }
  .save-state{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--ink-soft);
    padding-right:4px;
  }

  .content{
    flex:1;
    overflow:auto;
    padding:20px 24px 40px;
  }

  /* ---------- TABLE ---------- */
  .table-scroll{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    overflow:auto;
    box-shadow:var(--shadow-1);
  }
  table.data-table{
    border-collapse:collapse;
    width:100%;
    min-width:600px;
  }
  .data-table thead th{
    position:sticky; top:0;
    background:var(--surface-2);
    text-align:left;
    padding:10px 12px;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    font-weight:600;
    border-bottom:1px solid var(--line-strong);
    white-space:nowrap;
    z-index:2;
  }
  .data-table thead th.col-actions{ text-align:right; position:sticky; right:0; background:var(--surface-2); z-index:3;}
  .data-table tbody td{
    padding:9px 12px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
    max-width:260px;
  }
  .data-table tbody tr:hover{ background:rgba(61,107,92,0.045); }
  .data-table tbody tr.editing{ background:rgba(224,145,46,0.06); }
  .cell-text{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    display:block;
  }
  .cell-code{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink); }
  .cell-input{
    width:100%;
    min-width:90px;
    padding:5px 7px;
    border:1px solid var(--line-strong);
    border-radius:4px;
    background:var(--surface);
    color:var(--ink);
  }
  .cell-input:focus{ border-color:var(--focus); }
  td.col-actions{
    text-align:right;
    white-space:nowrap;
    position:sticky; right:0;
    background:var(--surface);
  }
  .data-table tbody tr:hover td.col-actions{ background:#F6F1E9; }
  .data-table tbody tr.editing td.col-actions{ background:#FBEFDC; }
  .row-actions{ display:inline-flex; gap:6px; }

  .status-tag{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:11px;
    font-weight:500;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .status-inuse{ background:rgba(61,107,92,0.12); color:var(--teal); border-color:rgba(61,107,92,0.3);}
  .status-stock{ background:rgba(224,145,46,0.13); color:#9C6414; border-color:rgba(224,145,46,0.35);}
  .status-dead{ background:rgba(178,58,46,0.1); color:var(--rust); border-color:rgba(178,58,46,0.3);}
  .status-plain{ background:var(--surface-2); color:var(--ink-soft); border-color:var(--line);}

  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state svg{ margin-bottom:12px; opacity:0.5; }
  .empty-state h3{ font-family:'Space Grotesk',sans-serif; color:var(--ink); margin:0 0 6px; }
  .empty-state p{ margin:0 0 16px; font-size:13px; }

  .result-count{
    font-size:12px; color:var(--ink-soft); margin:0 0 10px;
  }

  /* ---------- OVERVIEW ---------- */
  .ov-hero{
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    background:linear-gradient(135deg, var(--rail-bg) 0%, #24352A 100%);
    color:#EDEFE7;
    border-radius:var(--radius-md);
    padding:26px 28px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .ov-hero-num{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:54px; line-height:1; }
  .ov-hero-label{ font-size:12.5px; color:#B7C0B2; margin-top:6px; }
  .ov-hero-meta{ font-size:12px; color:#B7C0B2; text-align:right; }
  .ov-hero-meta .mono{ color:#F5DBAE; }
  .ov-grid{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap:18px;
  }
  @media (max-width: 920px){ .ov-grid{ grid-template-columns:1fr; } }
  .ov-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:18px 18px 8px;
    box-shadow:var(--shadow-1);
  }
  .ov-card h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:14px; margin:0 0 14px;
  }
  .bar-row{
    display:grid;
    grid-template-columns: 118px 1fr 34px;
    align-items:center;
    gap:10px;
    padding:6px 0;
    cursor:pointer;
    border-radius:4px;
  }
  .bar-row:hover{ background:var(--surface-2); }
  .bar-row .bar-name{
    font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .bar-track{
    height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;
    border:1px solid var(--line);
  }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--teal), #5C9683); border-radius:4px; }
  .bar-count{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); text-align:right; }
  .stat-line{
    display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;
  }
  .stat-line:last-child{ border-bottom:none; }
  .stat-line b{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .tag-pill{
    display:inline-block; padding:2px 7px; border-radius:3px; font-size:10.5px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); margin:2px 4px 2px 0;
  }

  /* ---------- MODAL / TOAST ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(23,32,25,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background:var(--surface);
    border-radius:var(--radius-md);
    width:100%; max-width:460px;
    box-shadow:var(--shadow-2);
    overflow:hidden;
  }
  .modal-head{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .modal-head h3{ font-family:'Space Grotesk',sans-serif; margin:0 0 4px; font-size:16px; }
  .modal-head p{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .modal-body{ padding:18px 20px; }
  .modal-body label{
    display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500;
  }
  .modal-body input[type=text], .modal-body select, .modal-body textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line-strong);
    border-radius:5px; margin-bottom:14px; background:var(--surface);
  }
  .modal-body .radio-row{ display:flex; gap:10px; margin-bottom:14px; }
  .modal-body .radio-opt{
    flex:1; border:1px solid var(--line-strong); border-radius:6px; padding:10px 12px; cursor:pointer;
  }
  .modal-body .radio-opt.selected{ border-color:var(--teal); background:rgba(61,107,92,0.06); }
  .modal-body .radio-opt div:first-child{ font-weight:600; font-size:12.5px; margin-bottom:2px; }
  .modal-body .radio-opt div:last-child{ font-size:11px; color:var(--ink-soft); }
  .modal-foot{
    padding:14px 20px; border-top:1px solid var(--line);
    display:flex; justify-content:flex-end; gap:8px;
  }
  .toast-wrap{
    position:fixed; bottom:20px; right:20px; z-index:200;
    display:flex; flex-direction:column; gap:8px;
  }
  .toast{
    background:var(--rail-bg); color:#EDEFE7;
    padding:11px 16px; border-radius:6px;
    font-size:12.5px; box-shadow:var(--shadow-2);
    display:flex; align-items:center; gap:8px;
    animation: toast-in .18s ease;
    max-width:320px;
  }
  .toast.err{ background:var(--rust); }
  .toast.ok .dot{ background:#8FC5A9; }
  .toast .dot{ width:6px; height:6px; border-radius:50%; background:var(--amber); flex:none; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:6px; }
  .rail-list::-webkit-scrollbar-thumb{ background:rgba(231,233,225,0.18); }

  @media (max-width: 760px){
    .app{ grid-template-columns: 1fr; grid-template-rows:56px 1fr; height:100vh; min-height:100vh; overflow:hidden; }
    .rail{
      position:fixed; top:0; left:0; bottom:0;
      width:82vw; max-width:300px; max-height:none;
      transform:translateX(-100%);
      transition:transform .22s ease;
      z-index:40;
      box-shadow:4px 0 28px rgba(0,0,0,0.4);
    }
    .app.nav-open .rail{ transform:translateX(0); }
    .main{ height:100%; overflow:hidden; display:flex; flex-direction:column; }
    .content{ padding:16px; flex:1; overflow:auto; }
  }

  .mobile-topbar{ display:none; }
  .rail-backdrop{ display:none; }

  @media (max-width: 760px){
    .mobile-topbar{
      display:flex; align-items:center; gap:10px;
      padding:0 14px; height:56px; flex:none;
      background:var(--rail-bg); color:var(--rail-ink);
      border-bottom:1px solid rgba(231,233,225,0.12);
      position:relative; z-index:20;
    }
    .mobile-menu-btn{
      width:34px; height:34px; border-radius:6px;
      border:1px solid rgba(231,233,225,0.22);
      background:transparent; color:var(--rail-ink);
      display:flex; align-items:center; justify-content:center;
      flex:none; cursor:pointer;
    }
    .mobile-menu-btn:hover{ background:rgba(231,233,225,0.08); }
    .mobile-topbar-logo{ width:24px; height:24px; border-radius:6px; flex:none; }
    .mobile-topbar-title{
      font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14.5px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .rail-backdrop{
      display:block;
      position:fixed; inset:0;
      background:rgba(10,14,11,0.5);
      opacity:0; pointer-events:none;
      transition:opacity .22s ease;
      z-index:30;
    }
    .app.nav-open .rail-backdrop{ opacity:1; pointer-events:auto; }
    .rail-close-btn{ display:flex; }
  }

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(224,145,46,0.10), transparent 45%),
      linear-gradient(160deg, var(--rail-bg) 0%, #202E24 55%, #1A2620 100%);
    padding:20px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(231,233,225,0.14);
    border-radius:10px;
    padding:32px 30px 26px;
    backdrop-filter:blur(2px);
    box-shadow:var(--shadow-2);
  }
  .login-logo{
    width:72px; height:72px;
    border-radius:16px;
    display:block;
    margin-bottom:16px;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .login-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.06em;
    color:var(--amber);
    background:rgba(224,145,46,0.14);
    border:1px solid rgba(224,145,46,0.35);
    padding:3px 8px; border-radius:3px;
    margin-bottom:14px;
  }
  .login-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:24px; color:#EDEFE7;
    margin:0 0 4px;
  }
  .login-sub{
    font-size:12px; color:var(--rail-ink-soft);
    margin:0 0 26px;
  }
  .login-field{ margin-bottom:15px; }
  .login-field label{
    display:block; font-size:11px; color:var(--rail-ink-soft);
    margin-bottom:6px; letter-spacing:0.02em;
  }
  .login-field input{
    width:100%; padding:10px 12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(231,233,225,0.2);
    border-radius:6px;
    color:#EDEFE7;
  }
  .login-field input:focus{ border-color:var(--amber); background:rgba(255,255,255,0.08); }
  .login-field input::placeholder{ color:rgba(231,233,225,0.35); }
  .login-error{
    font-size:12px; color:#F4A79A;
    background:rgba(178,58,46,0.16);
    border:1px solid rgba(178,58,46,0.4);
    border-radius:5px;
    padding:8px 10px;
    margin-bottom:15px;
    display:none;
  }
  .login-error.show{ display:block; }
  .login-btn{
    width:100%;
    padding:11px;
    border-radius:6px;
    border:1px solid var(--amber);
    background:var(--amber);
    color:var(--amber-ink);
    font-weight:600; font-size:13.5px;
    cursor:pointer;
  }
  .login-btn:hover{ background:#cc8228; }
  .login-hint{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid rgba(231,233,225,0.12);
    font-size:11px;
    color:var(--rail-ink-soft);
    line-height:1.6;
  }
  .login-hint .mono{ color:#D9BE8C; }
  .login-foot{
    text-align:center;
    margin-top:18px;
    font-size:11px;
    color:rgba(231,233,225,0.35);
  }
  .rail-foot-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .rail-foot-actions{ display:flex; gap:6px; }
  .rail-icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:5px;
    border:1px solid rgba(231,233,225,0.18);
    background:transparent; color:var(--rail-ink-soft);
    cursor:pointer;
  }
  .rail-icon-btn:hover{ color:var(--rail-ink); border-color:rgba(231,233,225,0.4); }
  .app-credit{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    padding:10px 0 0;
  }
  .gh-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    margin-right:6px; vertical-align:middle;
  }
  .gh-dot.on{ background:#5C9683; box-shadow:0 0 0 2px rgba(92,150,131,0.25); }
  .gh-dot.off{ background:var(--rail-ink-soft); }
  #railGithub .ri-count svg{ opacity:0.7; }

  mobileNavOpen: false,
  authUser: DEFAULT_USER,
  authHash: null
};

var root = document.getElementById('root');
var toastWrap = document.getElementById('toastWrap');
var rowIdCounter = 1;

function uid(){ return 'r' + (rowIdCounter++) + '_' + Math.random().toString(36).slice(2,7); }

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function ensureRowIds(data){
  Object.keys(data).forEach(function(cat){
    data[cat].rows.forEach(function(r){
      if(!r.__id) r.__id = uid();
    });
  });
  return data;
}

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ---------------- persistence ---------------- */

// Three possible backends, tried in this order:
// 1. GitHub (if the user connected a repo in Settings) — real shared "server",
//    free, works from any device/browser, data lives in your own GitHub repo.
// 2. Claude's built-in storage (window.storage) — only available while this
//    is opened live inside Claude.ai.
// 3. Plain browser localStorage — last-resort fallback, saved on that device only.
var usingCloudStorage = false;
var GH_CONFIG_KEY = "pma-github-config-v1";
var githubConfig = null; // {owner, repo, branch, token, dataPath, authPath}
var ghShaCache = {}; // path -> last known sha, needed for GitHub's update API

function loadGithubConfig(){
  try{
    var raw = localStorage.getItem(GH_CONFIG_KEY);
    githubConfig = raw ? JSON.parse(raw) : null;
  }catch(e){ githubConfig = null; }
}

function saveGithubConfig(cfg){
  githubConfig = cfg;
  ghShaCache = {};
  try{ localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){}
}

function clearGithubConfig(){
  githubConfig = null;
  ghShaCache = {};
  try{ localStorage.removeItem(GH_CONFIG_KEY); }catch(e){}
}

function hasGithubConfig(){
  return !!(githubConfig && githubConfig.owner && githubConfig.repo);
}

function ghPathFor(key){
  if(key === STORAGE_KEY) return (githubConfig.dataPath || 'asset-data.json');
  if(key === AUTH_KEY) return (githubConfig.authPath || 'auth.json');
  return key + '.json';
}

function ghApiUrl(path){
  var branch = githubConfig.branch || 'main';
  return 'https://api.github.com/repos/' + encodeURIComponent(githubConfig.owner) + '/' +
    encodeURIComponent(githubConfig.repo) + '/contents/' + path + '?ref=' + encodeURIComponent(branch);
}

function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }

function githubFetchFile(path){
  var headers = {'Accept':'application/vnd.github+json'};
  if(githubConfig.token) headers['Authorization'] = 'Bearer ' + githubConfig.token;
  return fetch(ghApiUrl(path), {headers: headers}).then(function(res){
    if(res.status === 404) return null;
    if(!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(e){
        throw new Error(e.message || ('GitHub error ' + res.status));
      });
    }
    return res.json();
  }).then(function(json){
    if(!json) return null;
    ghShaCache[path] = json.sha;
    return b64DecodeUnicode(json.content);
  });
}

function githubWriteFile(path, contentStr){
  if(!githubConfig.token){
    return Promise.reject(new Error('Token GitHub belum diisi — buka Sambungan GitHub di sidebar.'));
  }
  var headers = {
    'Accept':'application/vnd.github+json',
    'Authorization': 'Bearer ' + githubConfig.token,
    'Content-Type': 'application/json'
  };
  var body = {
    message: 'Update ' + path + ' via Sistem Asset PMA',
    content: b64EncodeUnicode(contentStr),
    branch: githubConfig.branch || 'main'
  };
  if(ghShaCache[path]) body.sha = ghShaCache[path];

  var url = 'https://api.github.com/repos/' + encodeURIComponent(githubConfig.owner) + '/' +
    encodeURIComponent(githubConfig.repo) + '/contents/' + path;

  return fetch(url, {method:'PUT', headers: headers, body: JSON.stringify(body)}).then(function(res){
    if(res.status === 409){
      // someone else saved in between — refetch sha once and retry
      return githubFetchFile(path).then(function(){
        body.sha = ghShaCache[path];
        return fetch(url, {method:'PUT', headers: headers, body: JSON.stringify(body)});
      });
    }
    return res;
  }).then(function(res){
    if(!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(e){
        throw new Error(e.message || ('GitHub error ' + res.status));
      });
    }
    return res.json();
  }).then(function(json){
    if(json && json.content && json.content.sha) ghShaCache[path] = json.content.sha;
    return json;
  });
}

function hasCloudStorage(){
  return typeof window !== 'undefined' && window.storage &&
    typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}

function storageGet(key, shared){
  if(hasGithubConfig()){
    var path = ghPathFor(key);
    return githubFetchFile(path).then(function(content){
      return content ? {key:key, value:content} : null;
    }).catch(function(err){
      toast('Gagal ambil data dari GitHub: ' + err.message, 'err');
      return null;
    });
  }
  if(hasCloudStorage()){
    usingCloudStorage = true;
    return window.storage.get(key, !!shared).catch(function(){ return null; });
  }
  return new Promise(function(resolve){
    try{
      var v = localStorage.getItem(key);
      resolve(v ? {key:key, value:v} : null);
    }catch(e){ resolve(null); }
  });
}

function storageSet(key, value, shared){
  if(hasGithubConfig()){
    var path = ghPathFor(key);
    return githubWriteFile(path, value).then(function(){
      return {key:key, value:value};
    }).catch(function(err){
      toast('Gagal simpan ke GitHub: ' + err.message, 'err');
      return null;
    });
  }
  if(hasCloudStorage()){
    return window.storage.set(key, value, !!shared).catch(function(){ return null; });
  }
  return new Promise(function(resolve){
    try{
      localStorage.setItem(key, value);
      resolve({key:key, value:value});
    }catch(e){ resolve(null); }
  });
}

function hashText(text){
  if(window.crypto && window.crypto.subtle && window.isSecureContext !== false){
    try{
      var enc = new TextEncoder().encode('pma::' + text);
      return window.crypto.subtle.digest('SHA-256', enc).then(function(buf){
        var arr = Array.from(new Uint8Array(buf));
        return arr.map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      }).catch(function(){ return fallbackHash(text); });
    }catch(e){ return Promise.resolve(fallbackHash(text)); }
  }
  return Promise.resolve(fallbackHash(text));
}

function fallbackHash(text){
  // Weak fallback only used when Web Crypto is unavailable (very old/non-secure contexts).
  var s = 'pma::' + text, h = 0;
  for(var i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
  return 'fb' + Math.abs(h).toString(16);
}

function loadData(){
  storageGet(STORAGE_KEY, true).then(function(res){
    if(res && res.value){
      try{
        var parsed = JSON.parse(res.value);
        state.data = ensureRowIds(parsed.data);
        state.order = parsed.order || Object.keys(state.data);
        state.lastSaved = parsed.savedAt || null;
      }catch(e){
        bootstrapDefault();
      }
    } else {
      bootstrapDefault();
    }
    finishBoot();
  }).catch(function(){
    bootstrapDefault();
    finishBoot();
  });
}

function finishBoot(){
  state.loaded = true;
  state.current = "__overview__";
  render();
}

function bootstrapDefault(){
  state.data = ensureRowIds(deepClone(DEFAULT_DATA));
  state.order = Object.keys(state.data);
}

function persist(silent){
  var payload = {
    data: state.data,
    order: state.order,
    savedAt: new Date().toISOString()
  };
  return storageSet(STORAGE_KEY, JSON.stringify(payload), true).then(function(res){
    if(res){
      state.dirty = false;
      state.lastSaved = payload.savedAt;
      if(!silent) toast('Perubahan berhasil disimpan.', 'ok');
      renderTopbarSaveState();
    } else {
      toast('Gagal menyimpan perubahan.', 'err');
    }
  }).catch(function(){
    toast('Gagal menyimpan perubahan.', 'err');
  });
}

function markDirty(){
  state.dirty = true;
  renderTopbarSaveState();
}

/* ---------------- toast ---------------- */

function toast(msg, kind){
  var el = document.createElement('div');
  el.className = 'toast ' + (kind === 'err' ? 'err' : 'ok');
  el.innerHTML = '<span class="dot"></span><span>' + escapeHtml(msg) + '</span>';
  toastWrap.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .25s ease';
    el.style.opacity = '0';
    setTimeout(function(){ el.remove(); }, 250);
  }, 2600);
}

/* ---------------- status tag helper ---------------- */

function statusClass(v){
  var s = String(v||"").toLowerCase();
  if(s.indexOf('in use') > -1 || s.indexOf('in user') > -1) return 'status-inuse';
  if(s.indexOf('stock') > -1) return 'status-stock';
  if(s.indexOf('dead') > -1 || s.indexOf('rusak') > -1) return 'status-dead';
  return 'status-plain';
}

function isStatusColumn(col){
  return /status/i.test(col);
}
function isCodeColumn(col){
  return /(asset no|serial|licence|ip$|no\.)/i.test(col);
}

function renderTopbarSaveState(){
  var el = document.getElementById('saveState');

    : usingCloudStorage ? ' (dibagikan ke tim)' : ' (di browser ini saja)';
  if(state.dirty){
    el.innerHTML = '<span class="unsaved-dot"></span> Ada perubahan belum disimpan';
    btn.removeAttribute('disabled');
  } else {
    el.innerHTML = state.lastSaved ? ('Tersimpan' + where + ' · ' + formatTime(state.lastSaved)) : ('Belum pernah disimpan' + where);
    btn.setAttribute('disabled','disabled');
  }

}

/* ---------------- overview ---------------- */

function renderOverview(){
  var sorted = state.order.slice().sort(function(a,b){ return categoryCount(b) - categoryCount(a); });
  var max = Math.max.apply(null, sorted.map(categoryCount).concat([1]));

  var bars = sorted.map(function(cat){
    var n = categoryCount(cat);
    var pct = Math.max(4, Math.round((n/max)*100));
    return '<div class="bar-row" data-cat="' + escapeHtml(cat) + '">' +
      '<span class="bar-name">' + escapeHtml(cat) + '</span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
      '<span class="bar-count mono">' + n + '</span>' +
    '</div>';
  }).join('');

  // status breakdown across all categories
  var statusCounts = {};
  state.order.forEach(function(cat){
    var cols = state.data[cat].columns;
    var statusCol = cols.find(isStatusColumn);
    if(!statusCol) return;
    state.data[cat].rows.forEach(function(r){
      var v = (r[statusCol] || '').toString().trim();
      if(!v) return;
      statusCounts[v] = (statusCounts[v]||0) + 1;
    });
  });
  var statusLines = Object.keys(statusCounts).sort(function(a,b){return statusCounts[b]-statusCounts[a];}).slice(0,7).map(function(k){
    return '<div class="stat-line"><span>' + escapeHtml(k) + '</span><b class="mono">' + statusCounts[k] + '</b></div>';
  }).join('') || '<div class="stat-line"><span>Tidak ada data status</span></div>';

  var locSet = {};
  state.order.forEach(function(cat){
    var cols = state.data[cat].columns;
    var locCol = cols.find(function(c){ return /lokasi/i.test(c); });
    if(!locCol) return;
    state.data[cat].rows.forEach(function(r){
      var v = (r[locCol]||'').toString().trim();
      if(v) locSet[v] = true;
    });
  });
  var locPills = Object.keys(locSet).sort().map(function(l){ return '<span class="tag-pill">' + escapeHtml(l) + '</span>'; }).join('') || '<span class="tag-pill">—</span>';

  return (
    '<div class="ov-hero">' +
      '<div>' +
        '<div class="ov-hero-num mono">' + totalAssets() + '</div>' +
        '<div class="ov-hero-label">total aset tercatat di ' + state.order.length + ' kategori</div>' +
      '</div>' +
      '<div class="ov-hero-meta">' +
        (state.lastSaved ? ('Terakhir disimpan<br><span class="mono">' + formatTime(state.lastSaved) + '</span>') : 'Belum pernah disimpan ke penyimpanan lokal') +
      '</div>' +
    '</div>' +
    '<div class="ov-grid">' +
      '<div class="ov-card"><h3>Aset per kategori</h3>' + bars + '</div>' +
      '<div>' +
        '<div class="ov-card" style="margin-bottom:18px;">' +
          '<h3>Status aset</h3>' + statusLines +
        '</div>' +
        '<div class="ov-card">' +
          '<h3>Lokasi tercatat</h3>' +
          '<div style="padding-bottom:14px;">' + locPills + '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function getFilteredRows(){
  var cat = state.current;
  var rows = state.data[cat].rows;
  if(!state.search) return rows;
  var q = state.search.toLowerCase();
  return rows.filter(function(r){
    return Object.keys(r).some(function(k){
      if(k === '__id') return false;
      return String(r[k]||'').toLowerCase().indexOf(q) > -1;
    });
  });
}

function renderTable(){
  var cat = state.current;
  var cols = state.data[cat].columns;
  var rows = getFilteredRows();

  var head = cols.map(function(c){ return '<th>' + escapeHtml(c) + '</th>'; }).join('') + '<th class="col-actions">Aksi</th>';

  var bodyRows = rows.map(function(r){ return renderRow(r, cols); }).join('');

  var newRowHtml = '';
  if(state.addingNew){
    newRowHtml = renderRow(state.draft, cols, true);
  }

  var tableHtml =
    '<div class="table-scroll"><table class="data-table"><thead><tr>' + head + '</tr></thead><tbody>' +
      newRowHtml + bodyRows +
    '</tbody></table></div>';

  var emptyHtml = '';
  if(rows.length === 0 && !state.addingNew){
    tableHtml = '<div class="table-scroll">' +
      '<div class="empty-state">' +
        (state.search
          ? ('<h3>Tidak ada hasil</h3><p>Tidak ditemukan data untuk pencarian "' + escapeHtml(state.search) + '".</p>')
          : ('<h3>Belum ada data</h3><p>Kategori ini masih kosong. Tambahkan baris pertama atau import dari file.</p>')
        ) +
      '</div></div>';
  }

  var countLabel = state.search
    ? ('Menampilkan ' + rows.length + ' dari ' + state.data[cat].rows.length + ' baris')
    : (rows.length + ' baris');

  return '<p class="result-count">' + countLabel + '</p>' + tableHtml;
}

function renderRow(r, cols, isNew){
  var key = isNew ? '__new__' : r.__id;
  var editing = state.editingKey === key;
  var rowClass = editing ? ' class="editing"' : '';
  var cells;

  if(editing){
    cells = cols.map(function(c){
      var val = state.draft[c] == null ? '' : state.draft[c];
      return '<td><input class="cell-input" data-field="' + escapeHtml(c) + '" value="' + escapeHtml(val) + '"></td>';
    }).join('');
    var actions =
      '<td class="col-actions"><span class="row-actions">' +
        '<span class="icon-btn confirm" data-act="commit" title="Simpan baris">' + icon('check') + '</span>' +
        '<span class="icon-btn" data-act="cancel" title="Batal">' + icon('x') + '</span>' +
      '</span></td>';
    return '<tr' + rowClass + ' data-key="' + key + '">' + cells + actions + '</tr>';
  }

  cells = cols.map(function(c){
    var val = r[c];
    if(isStatusColumn(c) && val){
      return '<td><span class="status-tag ' + statusClass(val) + '">' + escapeHtml(val) + '</span></td>';
    }
    if(isCodeColumn(c) && val){
      return '<td><span class="cell-text cell-code">' + escapeHtml(val) + '</span></td>';
    }
    return '<td><span class="cell-text" title="' + escapeHtml(val) + '">' + escapeHtml(val === '' || val == null ? '—' : val) + '</span></td>';
  }).join('');

  var rowActions =
    '<td class="col-actions"><span class="row-actions">' +
      '<span class="icon-btn" data-act="edit" title="Sunting">' + icon('edit') + '</span>' +
      '<span class="icon-btn danger" data-act="delete" title="Hapus">' + icon('trash') + '</span>' +
    '</span></td>';

  return '<tr data-key="' + key + '">' + cells + rowActions + '</tr>';
}

/* ---------------- table events ---------------- */

function bindTableEvents(){
  var searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', function(e){
      state.search = e.target.value;
      var c = document.getElementById('content');
      c.innerHTML = renderTable();
      bindTableEvents();
      var si = document.getElementById('searchInput');
      if(si){ si.focus(); si.selectionStart = si.selectionEnd = si.value.length; }
    });
  }

  document.querySelectorAll('tr[data-key]').forEach(function(tr){
    var key = tr.getAttribute('data-key');
    tr.querySelectorAll('[data-act]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var act = btn.getAttribute('data-act');
        if(act === 'edit') startEdit(key);
        else if(act === 'delete') confirmDelete(key);
        else if(act === 'commit') commitEdit();
        else if(act === 'cancel') cancelEdit();
      });
    });
  });
}

function startEdit(id){
  if(state.editingKey || state.addingNew) return;
  var cat = state.current;
  var row = state.data[cat].rows.find(function(r){ return r.__id === id; });
  if(!row) return;
  state.editingKey = id;
  state.draft = deepClone(row);
  refreshTableOnly();
}

function cancelEdit(){
  state.editingKey = null;
  state.draft = null;
  state.addingNew = false;
  refreshTableOnly();
}

function commitEdit(){
  var cat = state.current;
  var cols = state.data[cat].columns;
  var inputs = document.querySelectorAll('tr.editing input[data-field]');
  var vals = {};
  inputs.forEach(function(inp){ vals[inp.getAttribute('data-field')] = inp.value; });

  if(state.addingNew){
    var newRow = { __id: uid() };
    cols.forEach(function(c){ newRow[c] = vals[c] || ''; });
    state.data[cat].rows.push(newRow);
    state.addingNew = false;
    toast('Baris baru ditambahkan.', 'ok');
  } else {
    var row = state.data[cat].rows.find(function(r){ return r.__id === state.editingKey; });
    if(row){
      cols.forEach(function(c){ row[c] = vals[c] || ''; });
      toast('Baris diperbarui.', 'ok');
    }
  }
  state.editingKey = null;
  state.draft = null;
  markDirty();
  refreshTableOnly();
  renderRailCountsOnly();
}

var pendingDeleteId = null;

function confirmDelete(id){
  pendingDeleteId = id;
  var cat = state.current;
  var row = state.data[cat].rows.find(function(r){ return r.__id === id; });
  var label = row ? (row['Asset No.'] || row['No.'] || 'baris ini') : 'baris ini';
  openModal({
    title: 'Hapus data aset?',
    body: '<p style="margin:0;color:var(--ink-soft);font-size:13px;">Data <b class="mono" style="color:var(--ink)">' + escapeHtml(label) + '</b> pada kategori <b>' + escapeHtml(cat) + '</b> akan dihapus permanen dari daftar ini. Tindakan ini tidak bisa dibatalkan setelah disimpan.</p>',
    okLabel: 'Hapus',
    okDanger: true,
    onOk: function(){
      var idx = state.data[cat].rows.findIndex(function(r){ return r.__id === id; });
      if(idx > -1) state.data[cat].rows.splice(idx,1);
      markDirty();
      closeModal();
      toast('Baris dihapus.', 'ok');
      renderAll();
    }
  });
}

function refreshTableOnly(){
  var c = document.getElementById('content');
  c.innerHTML = renderTable();
  bindTableEvents();
  var firstInput = document.querySelector('tr.editing input[data-field]');
  if(firstInput) firstInput.focus();
}

function renderRailCountsOnly(){
  var rail = document.querySelector('.rail');
  if(rail) rail.outerHTML = renderRail();
  bindRailEvents();
}

function renderAll(){

}

function bindTopbarEvents(){
  var btnSave = document.getElementById('btnSave');
  if(btnSave) btnSave.addEventListener('click', function(){ persist(false); });

  var btnAddRow = document.getElementById('btnAddRow');
  if(btnAddRow) btnAddRow.addEventListener('click', function(){
    if(state.editingKey || state.addingNew) return;
    var cat = state.current;
    var cols = state.data[cat].columns;
    state.addingNew = true;
    state.editingKey = '__new__';
    var draft = {};
    cols.forEach(function(c){ draft[c] = ''; });
    // auto-increment "No." if present
    if(cols.indexOf('No.') > -1){
      var maxNo = 0;
      state.data[cat].rows.forEach(function(r){
        var n = parseInt(r['No.'],10);
        if(!isNaN(n) && n > maxNo) maxNo = n;
      });
      draft['No.'] = String(maxNo + 1);
    }
    state.draft = draft;
    state.search = '';
    var c = document.getElementById('content');
    c.innerHTML = renderTable();
    bindTableEvents();
    var firstInput = document.querySelector('tr.editing input[data-field]');
    if(firstInput) firstInput.focus();
  });

  var btnExport = document.getElementById('btnExport');
  if(btnExport) btnExport.addEventListener('click', function(){ exportCategory(state.current); });

  var btnExportAll = document.getElementById('btnExportAll');
  if(btnExportAll) btnExportAll.addEventListener('click', exportAll);

  var btnImport = document.getElementById('btnImport');
  var fileInput = document.getElementById('fileInput');
  if(btnImport && fileInput){
    btnImport.addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(e){
      if(e.target.files && e.target.files[0]) handleImportFile(e.target.files[0]);
      fileInput.value = '';
    });
  }
}

/* ---------------- export ---------------- */

function exportCategory(cat){
  if(typeof XLSX === 'undefined'){
    toast('Pustaka Excel belum siap. Cek koneksi internet lalu muat ulang halaman.', 'err');
    return;
  }
  var cols = state.data[cat].columns;
  var rows = state.data[cat].rows.map(function(r){
    var o = {};
    cols.forEach(function(c){ o[c] = r[c] || ''; });
    return o;
  });
  var ws = XLSX.utils.json_to_sheet(rows, {header: cols});
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, cat.substring(0,31));
  XLSX.writeFile(wb, 'Asset_' + cat.replace(/[^a-z0-9]+/gi,'_') + '.xlsx');
  toast('Kategori "' + cat + '" diexport.', 'ok');
}

function exportAll(){
  if(typeof XLSX === 'undefined'){
    toast('Pustaka Excel belum siap. Cek koneksi internet lalu muat ulang halaman.', 'err');
    return;
  }
  var wb = XLSX.utils.book_new();
  state.order.forEach(function(cat){
    var cols = state.data[cat].columns;
    var rows = state.data[cat].rows.map(function(r){
      var o = {};
      cols.forEach(function(c){ o[c] = r[c] || ''; });
      return o;
    });
    var ws = XLSX.utils.json_to_sheet(rows, {header: cols});
    XLSX.utils.book_append_sheet(wb, ws, cat.substring(0,31));
  });
  XLSX.writeFile(wb, 'Asset_PT_PMA_Export.xlsx');
  toast('Seluruh data diexport ke satu file.', 'ok');
}

/* ---------------- import ---------------- */

function handleImportFile(file){
  if(typeof XLSX === 'undefined'){
    toast('Pustaka Excel belum siap. Cek koneksi internet lalu muat ulang halaman.', 'err');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(e.target.result, {type:'array'});
      var firstSheetName = wb.SheetNames[0];
      var ws = wb.Sheets[firstSheetName];
      var json = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!json.length){
        toast('File tidak berisi data yang bisa dibaca.', 'err');
        return;
      }
      var importedCols = Object.keys(json[0]);
      openImportModal(file.name, wb.SheetNames, importedCols, json, wb);
    }catch(err){
      toast('Gagal membaca file. Pastikan format .xlsx/.csv valid.', 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function openImportModal(filename, sheetNames, importedCols, jsonRows, wb){
  var targetOptions = state.order.map(function(c){ return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join('');
  var mode = 'append';

  var bodyHtml =
    '<label>File</label>' +
    '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;" class="mono">' + escapeHtml(filename) + ' · ' + jsonRows.length + ' baris terbaca</div>' +
    '<label>Simpan ke kategori</label>' +
    '<select id="impTarget">' + targetOptions + '<option value="__new__">+ Buat kategori baru dari nama sheet</option></select>' +
    '<div id="impNewCatWrap" style="display:none;">' +
      '<label>Nama kategori baru</label>' +
      '<input type="text" id="impNewCatName" value="' + escapeHtml(sheetNames[0]) + '">' +
    '</div>' +
    '<label>Mode import</label>' +
    '<div class="radio-row">' +
      '<div class="radio-opt selected" data-mode="append"><div>Tambahkan</div><div>Gabung dengan data yang ada</div></div>' +
      '<div class="radio-opt" data-mode="replace"><div>Ganti semua</div><div>Timpa data kategori ini</div></div>' +
    '</div>' +
    '<div style="font-size:11.5px;color:var(--ink-soft);">Kolom terdeteksi: ' + importedCols.map(function(c){return '<span class="tag-pill">'+escapeHtml(c)+'</span>';}).join('') + '</div>';

  openModal({
    title: 'Import data aset',
    bodyRaw: bodyHtml,
    okLabel: 'Import',
    onOk: function(){
      var targetSel = document.getElementById('impTarget');
      var target = targetSel.value;
      var modeEl = document.querySelector('.radio-opt.selected');
      var chosenMode = modeEl ? modeEl.getAttribute('data-mode') : 'append';

      if(target === '__new__'){
        var newName = document.getElementById('impNewCatName').value.trim() || ('Import ' + Date.now());
        if(state.data[newName]){ target = newName; }
        else{
          state.data[newName] = { columns: importedCols.slice(), rows: [] };
          state.order.push(newName);
          target = newName;
        }
      }

      var catObj = state.data[target];
      // merge new columns discovered in the import
      importedCols.forEach(function(c){
        if(catObj.columns.indexOf(c) === -1) catObj.columns.push(c);
      });

      var newRows = jsonRows.map(function(r){
        var obj = { __id: uid() };
        catObj.columns.forEach(function(c){ obj[c] = r[c] != null ? r[c] : ''; });
        return obj;
      });

      if(chosenMode === 'replace'){
        catObj.rows = newRows;
      } else {
        catObj.rows = catObj.rows.concat(newRows);
      }

      markDirty();
      state.current = target;
      state.search = '';
      closeModal();
      toast(newRows.length + ' baris diimport ke "' + target + '".', 'ok');
      renderAll();
    }
  });

  setTimeout(function(){
    var targetSel = document.getElementById('impTarget');
    var newCatWrap = document.getElementById('impNewCatWrap');
    targetSel.addEventListener('change', function(){
      newCatWrap.style.display = targetSel.value === '__new__' ? 'block' : 'none';
    });
    document.querySelectorAll('.radio-opt').forEach(function(opt){
      opt.addEventListener('click', function(){
        document.querySelectorAll('.radio-opt').forEach(function(o){ o.classList.remove('selected'); });
        opt.classList.add('selected');
      });
    });
  }, 0);
}

function openAccountModal(){
  var bodyHtml =
    '<label>Password saat ini</label>' +
    '<input type="password" id="accCurPass" autocomplete="current-password">' +
    '<label>Username baru (opsional)</label>' +
    '<input type="text" id="accNewUser" placeholder="' + escapeHtml(state.authUser) + '">' +

  openModal({

    onOk: function(){
      var curPass = document.getElementById('accCurPass').value;
      var newUser = document.getElementById('accNewUser').value.trim();
      var newPass = document.getElementById('accNewPass').value;
      var errEl = document.getElementById('accError');

      hashText(curPass).then(function(curHash){
        if(curHash !== state.authHash){
          errEl.textContent = 'Password saat ini salah.';
          errEl.style.display = 'block';
          return;
        }
        var finalUser = newUser || state.authUser;
        var finalPassPromise = newPass ? hashText(newPass) : Promise.resolve(state.authHash);
        finalPassPromise.then(function(finalHash){
          state.authUser = finalUser;
          state.authHash = finalHash;
          return storageSet(AUTH_KEY, JSON.stringify({user: finalUser, hash: finalHash}), true);
        }).then(function(){
          closeModal();
          toast('Akun diperbarui.', 'ok');
          renderRailCountsOnly();
        });
      });
    }
  });

        '<span class="login-tag">IT · INVENTORY</span>' +
        '<h1 class="login-title">Sistem Asset PMA</h1>' +
        '<p class="login-sub">by Adi Nugraha — masuk untuk mengelola data aset</p>' +
        '<div class="login-error" id="loginError">Username atau password salah.</div>' +
        '<form id="loginForm">' +
          '<div class="login-field">' +
            '<label>Username</label>' +
            '<input type="text" id="loginUser" autocomplete="username" autofocus>' +
          '</div>' +
          '<div class="login-field">' +
            '<label>Password</label>' +
            '<input type="password" id="loginPass" autocomplete="current-password">' +
          '</div>' +
          '<button type="submit" class="login-btn">Masuk</button>' +
        '</form>' +
        '<div class="login-hint" id="loginHint"></div>' +
      '</div>' +
    '</div>' +
    '<div class="app-credit"></div>';

  storageGet(AUTH_KEY, true).then(function(res){
    var hint = document.getElementById('loginHint');
    var shareLine = hasGithubConfig()
      ? ('Data & akun ini tersimpan di GitHub repo <span class="mono">' + escapeHtml(githubConfig.owner + '/' + githubConfig.repo) + '</span> — semua yang membuka halaman ini melihat & mengubah data yang sama.')
      : 'Data & akun ini <b>dibagikan</b> ke semua orang yang membuka tampilan ini di Claude — semua melihat & mengubah data yang sama.';
    if(res && res.value){
      try{
        var parsed = JSON.parse(res.value);
        state.authUser = parsed.user || DEFAULT_USER;
        state.authHash = parsed.hash;
      }catch(e){ /* keep defaults, will be re-created below */ }
    }
    if(!state.authHash){
      // first run: create the default shared account
      hashText(DEFAULT_PASS).then(function(h){
        state.authUser = DEFAULT_USER;
        state.authHash = h;
        storageSet(AUTH_KEY, JSON.stringify({user: DEFAULT_USER, hash: h}), true);
        if(hint) hint.innerHTML = 'Pertama kali? Masuk dengan <span class="mono">' + DEFAULT_USER + '</span> / <span class="mono">' + DEFAULT_PASS + '</span>, lalu ubah password lewat ikon gerigi di sidebar.<br><br>' + shareLine;
      });
    } else if(hint){
      hint.innerHTML = shareLine;
    }
  });

  var form = document.getElementById('loginForm');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPass').value;
    var errEl = document.getElementById('loginError');
    hashText(p).then(function(h){
      if(u === state.authUser && h === state.authHash){
        try{ sessionStorage.setItem(SESSION_KEY, '1'); }catch(e){}
        bootApp();
      } else {
        errEl.classList.add('show');
      }
    });
  });
}

function isSessionActive(){
  try{ return sessionStorage.getItem(SESSION_KEY) === '1'; }catch(e){ return false; }
}

/* ---------------- boot ---------------- */

function bootApp(){
  render(); // immediate loading state
  loadData();
}

// Never leave the page blank: show a real error state instead of silently failing.
window.addEventListener('error', function(ev){
  if(state.loaded) return;
  root.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:24px;">' +
      '<div style="max-width:420px;text-align:center;font-family:IBM Plex Sans,sans-serif;">' +
        '<h2 style="font-family:Space Grotesk,sans-serif;margin:0 0 8px;">Gagal memuat aplikasi</h2>' +
        '<p style="color:#565F58;font-size:13px;margin:0 0 4px;">Terjadi error saat menyiapkan data. Coba muat ulang halaman ini.</p>' +
        '<p style="color:#9AA096;font-size:11px;font-family:IBM Plex Mono,monospace;">' + escapeHtml(ev.message || 'unknown error') + '</p>' +
      '</div>' +
    '</div>';
});

try{
  loadGithubConfig();
  if(isSessionActive()){
    bootApp();
  } else {
    showLoginScreen();
  }
}catch(e){
  root.innerHTML = '<div style="padding:40px;font-family:IBM Plex Mono,monospace;font-size:12px;color:#B23A2E;">Gagal memuat aplikasi: ' + escapeHtml(e.message) + '</div>';
}

})();

</script>
<script>
  // Register the PWA service worker only when served over http(s) (e.g. GitHub
  // Pages). This is skipped harmlessly inside the Claude preview / local files.
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* offline shell just won't be available */ });
    });
  }
</script>
</body>
</html>
